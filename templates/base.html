{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Eternas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fffafc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #8e3b68;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .hero {
            padding: 100px 0;
            text-align: center;
            background: linear-gradient(rgba(142,59,104,.8), rgba(142,59,104,.8)),
                        url('https://images.unsplash.com/photo-1520763185298-1b434c919102');
            background-size: cover;
            background-position: center;
            color: white;
        }

        .section-title {
            color: #8e3b68;
            font-weight: bold;
            margin-bottom: 30px;
        }

        footer {
            background: #8e3b68;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }

        .card {
            border: none;
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }

        .btn-custom {
            background: #8e3b68;
            color: white;
        }

        .btn-custom:hover {
            background: #6f2d52;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'flowers:home' %}">
            🌸 Flores Eternas
        </a>

        <button
            class="navbar-toggler bg-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Mostrar u ocultar el menú"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:home' %}">
                        Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:collections' %}">
                        Colecciones
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:services' %}">
                        Ramos y servicios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:about' %}">
                        Sobre nosotros
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:contact' %}">
                        Contacto
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'flowers:order' %}">
                        Hacer un pedido
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

<footer>
    <p class="mb-0">
        © 2026 Flores Eternas | Flores hermosas para cada ocasión
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
